services:
  traefikcop:
    container_name: traefikcop
    image: traefikcop:local
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - traefikcop-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || '3001') + '/api/session').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  traefikcop-data:
